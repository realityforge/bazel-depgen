tasks:
  - id: PLAN-01
    title: Finalize planning artifacts for repository naming strategy
    status: completed
    priority: high
    depends_on: []
    acceptance_criteria:
      - Requirements capture all resolved design decisions.
      - Implementation plan phases and risks are explicit.
      - Task board uses stable task IDs for follow-on execution.
    files_touched:
      - plans/repository-naming-strategy/00-requirements.md
      - plans/repository-naming-strategy/10-implementation-plan.md
      - plans/repository-naming-strategy/20-task-board.yaml
    evidence:
      - command: design-review session
        result: resolved configuration, override, collision, plugin-naming, and validation decisions
    commit:
      hash: not_required
      message: planning only in current session

  - id: CFG-01
    title: Add repository naming config surface and enum support
    status: completed
    priority: high
    depends_on: [PLAN-01]
    acceptance_criteria:
      - "`NameStrategy` includes `GroupIdAndArtifactIdAndVersion`."
      - "`OptionsConfig` exposes `repositoryNameStrategy`."
      - "`ArtifactConfig` exposes `repositoryNameStrategy` and `repositoryName`."
      - Parsing tests cover new config fields.
    files_touched:
      - src/main/java/org/realityforge/bazel/depgen/config/*.java
      - src/test/java/org/realityforge/bazel/depgen/config/*.java
      - src/main/resources/org/realityforge/bazel/depgen/templates/dependencies.yml
    evidence:
      - command: bundle exec buildr test
        result: Added NameStrategy version-inclusive enum value and config parsing for repositoryNameStrategy and repositoryName.
    commit:
      hash: not_required
      message: Add repository naming configuration surface

  - id: EMIT-01
    title: Split naming derivation and update repository emission
    status: completed
    priority: high
    depends_on: [CFG-01]
    acceptance_criteria:
      - Repository emission uses repository naming helpers only.
      - Target naming still uses target naming helpers only.
      - Private plugin names derive from Java target naming.
      - Explicit `repositoryName` values are treated as absolute and bypass `namePrefix`.
      - Default generated repository names remain unchanged without new config.
    files_touched:
      - src/main/java/org/realityforge/bazel/depgen/record/ArtifactRecord.java
      - src/test/java/org/realityforge/bazel/depgen/record/ArtifactRecordTest.java
      - src/test/java/org/realityforge/bazel/depgen/record/ApplicationRecordTest.java
    evidence:
      - command: bundle exec buildr test
        result: Target naming and repository naming are derived independently; plugin private names now derive from Java target names.
    commit:
      hash: not_required
      message: Separate target and repository naming derivation

  - id: VALIDATE-CFG-01
    title: Add config and model validation for naming configuration
    status: completed
    priority: high
    depends_on: [EMIT-01]
    acceptance_criteria:
      - "`repositoryName` and `repositoryNameStrategy` conflict is rejected."
      - Literal `repositoryName` values are validated against `[a-z][a-z0-9_]*`.
      - "`repositoryName`, `java.name`, `j2cl.name`, `plugin.name`, and `namePrefix` reject `__`."
      - Static naming-shape failures occur before dependency resolution.
    files_touched:
      - src/main/java/org/realityforge/bazel/depgen/config/*.java
      - src/main/java/org/realityforge/bazel/depgen/model/*.java
      - src/test/java/org/realityforge/bazel/depgen/config/*.java
      - src/test/java/org/realityforge/bazel/depgen/model/*.java
    evidence:
      - command: bundle exec buildr test
        result: Static validation rejects conflicting repository naming settings, invalid repositoryName values and forbidden __ in user naming overrides.
    commit:
      hash: not_required
      message: Validate repository naming configuration

  - id: VALIDATE-EMIT-01
    title: Add emitted-name validation for repository and plugin namespaces
    status: completed
    priority: high
    depends_on: [VALIDATE-CFG-01]
    acceptance_criteria:
      - Replacement records are excluded from emitted-name validation.
      - Repository uniqueness is checked against the exact repository rules that would be emitted.
      - Non-emitted repository family members do not cause false conflicts.
      - Generated repository-family collisions fail validation.
      - Built-in helper targets such as `verify_config_sha256` and `regenerate_depgen_extension`, including prefixed variants, are included in emitted target namespace validation when emitted.
      - Private `__plugin_library` and `__plugin` targets are validated against public names and against each other.
      - Tests prove replacements do not create false public/private target collisions.
      - Validation messages point users to corrective configuration.
    files_touched:
      - src/main/java/org/realityforge/bazel/depgen/record/*.java
      - src/test/java/org/realityforge/bazel/depgen/record/*.java
    evidence:
      - command: bundle exec buildr test
        result: Emitted-name validation covers repositories, helper targets and private plugin targets while excluding replacements.
    commit:
      hash: not_required
      message: Validate emitted repository and plugin target names

  - id: TEST-01
    title: Complete coverage for new naming behavior
    status: completed
    priority: high
    depends_on: [VALIDATE-EMIT-01]
    acceptance_criteria:
      - Tests cover all repository naming strategies.
      - Tests cover target/repository independence.
      - Tests cover explicit repository-name precedence and derived suffix repos.
      - Tests cover explicit `repositoryName` bypassing `namePrefix`.
      - Tests cover `java.name`, `j2cl.name`, `plugin.name`, and `namePrefix` rejecting `__`.
      - Tests cover emitted-only repository collision scope.
      - Tests cover helper-target namespace collisions, including prefixed helper-target names.
      - Tests cover internal plugin namespace collisions.
      - Tests cover replacements being ignored by emitted-name collision validation.
      - Tests cover target naming with version-inclusive strategy.
    files_touched:
      - src/test/java/org/realityforge/bazel/depgen/**/*.java
    evidence:
      - command: bundle exec buildr test
        result: Full test suite passed with coverage for repository naming strategies, helper-target collisions, emitted-only repository scope and replacement exclusions.
    commit:
      hash: not_required
      message: Add coverage for repository naming strategy behavior

  - id: DOC-01
    title: Update user-facing docs and changelog
    status: completed
    priority: medium
    depends_on: [TEST-01]
    acceptance_criteria:
      - Template docs explain target vs repository naming.
      - Template docs document `repositoryNameStrategy` and `repositoryName`.
      - "`CHANGELOG.md` contains an `Unreleased` entry."
    files_touched:
      - src/main/resources/org/realityforge/bazel/depgen/templates/dependencies.yml
      - CHANGELOG.md
    evidence:
      - command: bundle exec buildr test
        result: Template documentation and changelog updated to describe repositoryNameStrategy and repositoryName behavior.
    commit:
      hash: not_required
      message: Document repository naming strategies and overrides

  - id: PLAN-APPROVAL
    title: Request and record user review of planning artifacts
    status: completed
    priority: high
    depends_on: [PLAN-01]
    acceptance_criteria:
      - User is explicitly asked to review the plan.
      - Any feedback is reflected in planning artifacts.
      - Approval outcome is recorded before implementation begins.
    files_touched:
      - plans/repository-naming-strategy/00-requirements.md
      - plans/repository-naming-strategy/10-implementation-plan.md
      - plans/repository-naming-strategy/20-task-board.yaml
    evidence:
      - command: user review
        result: User re-reviewed the updated plan and requested implementation to proceed.
    commit:
      hash: not_required
      message: plan approved prior to implementation
