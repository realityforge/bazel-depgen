      - Keep the prototype only if the Timing Measurement Protocol passes with at least 10% median uncached `record:all_tests` improvement, or if per-artifact Maven Resolver deployment sessions are eliminated with no test or coverage regression and no more than 5% median uncached slowdown.
      - Run three before and three after uncached `record:all_tests` timings and compare median elapsed time.
      - Direct fixture writes satisfy the fixture-writer contract in `00-requirements.md`.
      - Test fixtures no longer create a Maven Resolver deployment session for every synthetic artifact.
      - Existing resolver-backed tests still pass.
      - Existing resolver-heavy coverage passes, including `//src/test/java/org/realityforge/bazel/depgen:resolver_tests`.
      - Before/after timing evidence is recorded for record tests.
      - Coverage command passes after the change.
    files:
      - src/test/java/org/realityforge/bazel/depgen/AbstractTest.java
      - plans/test-speed-phase2/20-task-board.yaml
