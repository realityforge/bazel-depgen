plan:
  id: ariake-agent-rules
  title: Adopt Ariake agent rules
tasks:
  - id: AAR-01
    title: Add Ariake rules to AGENTS
    status: completed
    priority: high
    depends_on: []
    acceptance:
      - AGENTS.md contains the three Ariake non-negotiable rules.
    files:
      - AGENTS.md
    evidence:
      - command: manual file edit
        result: AGENTS.md now contains Ariake's three non-negotiable Bazel/check rules
    commit:
      hash: not_required
      message: null
  - id: AAR-02
    title: Align Bazel source ownership
    status: completed
    priority: high
    depends_on:
      - AAR-01
    acceptance:
      - Java source package directories own their BUILD.bazel files.
      - Bazel source targets list source files explicitly.
      - No Bazel source target uses glob().
    files:
      - src/main/java/**/BUILD.bazel
      - src/test/java/**/BUILD.bazel
      - src/main/java/org/realityforge/bazel/depgen/metadata/DepgenMetadata.java
    evidence:
      - command: bazel build //...
        result: Build completed successfully, 10 total actions
      - command: rg -n "glob\\(" -g 'BUILD.bazel' -g '*.bzl' -g 'MODULE.bazel'
        result: no matches
      - command: find src/main/java src/test/java -type f -name '*.java' -exec dirname {} \\; | sort -u | while read d; do test -f "$d/BUILD.bazel" || echo "missing $d/BUILD.bazel"; done
        result: no output
    commit:
      hash: not_required
      message: null
  - id: AAR-03
    title: Validate repository gate
    status: completed
    priority: high
    depends_on:
      - AAR-02
    acceptance:
      - tools/check.sh passes.
    files:
      - tools/check.sh
    evidence:
      - command: tools/check.sh
        result: Build completed successfully; //third_party/java:verify_config_sha256 PASSED; //src/test/java/org/realityforge/bazel/depgen:all_tests PASSED
    commit:
      hash: not_required
      message: null
