    acceptance_criteria:
      - "`ApplicationRecord` can derive a root-to-artifact path for a failing `ArtifactRecord`."
      - Path matching uses the artifact record's resolved `DependencyNode`.
      - Multiple roots choose the shortest path.
      - Path roots exclude automatic system artifacts.
    files_touched:
