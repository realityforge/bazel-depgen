plan:
  id: errorprone-rules
  title: Adopt Ariake Error Prone strictness
tasks:
  - id: EPR-01
    title: Port built-in Error Prone checks
    status: completed
    priority: high
    depends_on: []
    acceptance:
      - Java wrapper rules no longer disable Error Prone.
      - Ariake's built-in Error Prone rule list is enabled where supported.
      - Java 17 release targeting is preserved.
    files:
      - third_party/java/rules.bzl
    evidence:
      - command: bazel run //:buildifier
        result: Build completed successfully; buildifier ran on the updated wrapper rules
      - command: bazel build //... --keep_going
        result: Varifier failed immediately and source scan found 437 constructor-initialized local declarations, so Varifier was omitted as broad mechanical churn
      - command: bazel build //... --keep_going --javacopt=-Xep:RequireExplicitNullMarking:ERROR
        result: Build completed successfully, 23 total actions
      - command: bazel build //... --keep_going --javacopt=-Xep:NullAway:ERROR --javacopt=-XepOpt:NullAway:OnlyNullMarked=true
        result: Build completed successfully, 23 total actions
    commit:
      hash: not_required
      message: null
  - id: EPR-02
    title: Resolve strict-check source impact
    status: completed
    priority: high
    depends_on:
      - EPR-01
    acceptance:
      - `bazel build //...` passes.
      - Any source edits are small, direct responses to strict-check findings.
    files:
      - src/main/java/**/*.java
      - src/test/java/**/*.java
    evidence:
      - command: bazel build //...
        result: Build completed successfully, 23 total actions
    commit:
      hash: not_required
      message: null
  - id: EPR-03
    title: Validate full repository gate
    status: completed
    priority: high
    depends_on:
      - EPR-02
    acceptance:
      - `tools/check.sh` passes.
      - CHANGELOG.md records the stricter developer-facing checks.
    files:
      - CHANGELOG.md
      - tools/check.sh
    evidence:
      - command: tools/check.sh
        result: Build completed successfully; //third_party/java:verify_config_sha256 PASSED; //src/test/java/org/realityforge/bazel/depgen:all_tests PASSED
    commit:
      hash: not_required
      message: null
