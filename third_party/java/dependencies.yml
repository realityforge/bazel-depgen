# NOTE: run tools/update_java_deps.sh after editing this file to update generated content.

repositories:
  - name: central
    url: https://repo.maven.apache.org/maven2
options:
  workspaceDirectory: ../..
  nameStrategy: ArtifactId
  repositoryNameStrategy: ArtifactId
  repositoryRuleGenerationStrategy: module
  targetGenerationStrategy: build
  failOnMissingPom: false
  includeSource: false

artifacts:
  - coord: org.realityforge.bazel.depgen:bazel-depgen:jar:all:0.25
  - coord: org.realityforge.getopt4j:getopt4j:1.3
  - coord: javax.inject:javax.inject:1
  - coord: org.apache.maven.resolver:maven-resolver-api:1.3.3
  - coord: org.apache.maven.resolver:maven-resolver-spi:1.3.3
  - coord: org.apache.maven.resolver:maven-resolver-util:1.3.3
  - coord: org.apache.maven.resolver:maven-resolver-impl:1.3.3
  - coord: org.apache.maven.resolver:maven-resolver-connector-basic:1.3.3
  - coord: org.apache.maven.resolver:maven-resolver-transport-file:1.3.3
  - coord: org.apache.maven.resolver:maven-resolver-transport-http:1.3.3
  - coord: org.apache.httpcomponents:httpcore:4.4.10
  - coord: org.apache.httpcomponents:httpclient:4.5.6
    excludes:
      - avalon-framework:avalon-framework
      - log4j:log4j
      - logkit:logkit
  - coord: org.apache.maven:maven-resolver-provider:3.5.0
    excludes:
      - com.google.inject:guice
  - coord: org.apache.commons:commons-lang3:3.5
  - coord: commons-codec:commons-codec:1.12
  - coord: org.apache.maven:maven-model:3.5.0
  - coord: org.codehaus.plexus:plexus-utils:3.0.24
  - coord: org.codehaus.plexus:plexus-interpolation:1.25
  - coord: org.sonatype.plexus:plexus-sec-dispatcher:1.4
  - coord: org.sonatype.plexus:plexus-cipher:1.4
  - coord: org.apache.maven:maven-repository-metadata:3.5.0
  - coord: org.codehaus.plexus:plexus-component-annotations:1.7.1
  - coord: org.apache.maven:maven-model-builder:3.5.0
  - coord: org.apache.maven:maven-builder-support:3.5.0
  - coord: org.apache.maven:maven-artifact:3.5.0
  - coord: org.apache.maven:maven-settings-builder:3.5.0
  - coord: org.apache.maven:maven-settings:3.5.0
  - coord: com.google.guava:guava:20.0
    excludes:
      - com.google.errorprone:error_prone_annotations
      - com.google.j2objc:j2objc-annotations
      - org.codehaus.mojo:animal-sniffer-annotations
  - coord: org.slf4j:slf4j-api:1.7.25
  - coord: org.slf4j:slf4j-jdk14:1.7.25
  - coord: org.slf4j:jcl-over-slf4j:1.7.25
  - coord: org.yaml:snakeyaml:2.6
  - coord: org.realityforge.gir:gir-core:0.12
  - coord: org.testng:testng:7.4.0
    excludes:
      - com.google.inject:guice
      - junit:junit
      - org.apache.ant:ant
      - org.yaml:snakeyaml
  - coord: com.beust:jcommander:1.78
  - coord: org.webjars:jquery:3.5.1
  - coord: com.uber.nullaway:nullaway:0.13.7
  - coord: org.jspecify:jspecify:1.0.0
    excludes:
      - '*:*'
